<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz Matemático PRO</title>

<style>
body{
     margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url(fot.dorado.jpeg) no-repeat center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    
}

.container{
    width:90%;
    max-width:600px;
    padding:25px;
    border-radius:20px;
    text-align:center;

    background: rgba(245, 241, 8, 0.6);
    backdrop-filter: blur(10px);

    box-shadow:0 0 30px rgba(255,255,255,0.3);
}

h1{
    text-shadow:0 0 15px #fff;
}

button{
    display:block;
    margin:12px auto;
    padding:12px;
    width:70%;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;

    background: linear-gradient(45deg,#ffca28,#ff7043);
    box-shadow:0 0 10px #fff;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #fff;
}

.correct{background:#66bb6a!important;box-shadow:0 0 20px #66bb6a;}
.incorrect{background:#ef5350!important;box-shadow:0 0 20px #ef5350;}

.info{
    display:flex;
    justify-content:space-around;
    margin-bottom:10px;
}

#mensaje{
    margin-top:10px;
    font-size:18px;
    text-shadow:0 0 10px #fff;
}
</style>
</head>

<body>

<div class="container">

<h1>🐱 Quiz Matemático PRO</h1>

<div id="menu">
<h2>✨ Elige tu nivel ✨</h2>
<button onclick="iniciar('facil')">🌱 Fácil</button>
<button onclick="iniciar('medio')">🔥 Medio</button>
<button onclick="iniciar('dificil')">⚡ Difícil</button>
<a href="menu.html"><button onclick="salir()">❌ Salir</button></a>
</div>

<div id="quiz" style="display:none;">
   

<div class="info">
<span id="vidas">❤️❤️❤️</span>
<span id="tiempo">⏱️ 30</span>
<span id="puntaje">⭐ 0</span>
</div>

<p id="pregunta"></p>
<div id="respuestas"></div>
<p id="mensaje"></p>
<a href="preguntas.html"><button onclick="salir()">❌ Salir</button></a>
</div>

</div>

<script>

const mensajesOK=["🌟 Excelente","🔥 Muy bien","🚀 Sigue así","💡 Inteligente","✨ Perfecto"];
const mensajesNO=["❌ Intenta otra vez","💭 Puedes mejorar","📚 Sigue practicando","⚡ No te rindas"];

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

const banco={
facil:[
{pregunta:"1/2 + 1/3",respuestas:["2/5","5/6","3/5","1/6"],correcta:1},
{pregunta:"3/4 - 1/4",respuestas:["1/2","2/4","3/4","1"],correcta:0},
{pregunta:"2/5 + 1/5",respuestas:["3/5","2/10","1/5","4/5"],correcta:0},
{pregunta:"x²-4=0",respuestas:["2 y -2","4","-4","0"],correcta:0},
{pregunta:"x²-9=0",respuestas:["3 y -3","9","-9","0"],correcta:0},

{pregunta:"1/2+1/2",respuestas:["1","2","1/2","0"],correcta:0},
{pregunta:"2/2",respuestas:["1","2","0","4"],correcta:0},
{pregunta:"3/3",respuestas:["1","3","0","2"],correcta:0},
{pregunta:"4/2",respuestas:["2","4","1","0"],correcta:0},
{pregunta:"6/3",respuestas:["2","3","1","0"],correcta:0},

{pregunta:"x²-1=0",respuestas:["1 y -1","1","-1","0"],correcta:0},
{pregunta:"x²-16=0",respuestas:["4 y -4","16","-16","0"],correcta:0},
{pregunta:"x²-25=0",respuestas:["5 y -5","25","-25","0"],correcta:0},
{pregunta:"x²-36=0",respuestas:["6 y -6","36","-36","0"],correcta:0},
{pregunta:"x²-49=0",respuestas:["7 y -7","49","-49","0"],correcta:0},

{pregunta:"1/3+1/3",respuestas:["2/3","1/6","3/3","1/3"],correcta:0},
{pregunta:"2/4",respuestas:["1/2","2","1/4","4/2"],correcta:0},
{pregunta:"5/5",respuestas:["1","5","0","2"],correcta:0},
{pregunta:"6/6",respuestas:["1","6","0","2"],correcta:0},
{pregunta:"4/4",respuestas:["1","4","2","0"],correcta:0}
],

medio:[
{pregunta:"2/3+3/4",respuestas:["17/12","5/7","1","6/12"],correcta:0},
{pregunta:"5/6-1/3",respuestas:["1/2","4/6","3/6","2/3"],correcta:0},
{pregunta:"3/5×2/3",respuestas:["6/15","2/5","3/8","5/6"],correcta:1},

{pregunta:"x²-5x+6=0",respuestas:["2 y 3","1 y 6","-2 y -3","0 y 5"],correcta:0},
{pregunta:"x²-7x+10=0",respuestas:["5 y 2","7 y 3","1 y 10","-5 y -2"],correcta:0},

// repetir similares hasta 20
...Array(15).fill({pregunta:"3/4+1/4",respuestas:["1","2","1/2","0"],correcta:0})
],

dificil:[
{pregunta:"4/3 ÷ 2/5",respuestas:["10/3","8/15","2/15","20/3"],correcta:0},
{pregunta:"7/8+5/6",respuestas:["41/24","1","2","12/14"],correcta:0},

{pregunta:"2x²-4x-6=0",respuestas:["3 y -1","2 y -3","1 y -6","0 y 6"],correcta:0},

// completar hasta 20
...Array(17).fill({pregunta:"2/3+1/6",respuestas:["5/6","1","2","3/6"],correcta:0})
]
};

let preguntas=[],i=0,vidas=3,puntos=0,tiempo=30,timer;

function iniciar(n){
preguntas=banco[n];
i=0;vidas=3;puntos=0;
menu.style.display="none";
quiz.style.display="block";
cargar();
}

function cargar(){
tiempo=30;
mensaje.innerText="";
pregunta.innerText=preguntas[i].pregunta;
respuestas.innerHTML="";
actualizar();

timer=setInterval(()=>{
tiempo--;tiempoEl.innerText="⏱️ "+tiempo;
if(tiempo<=0){clearInterval(timer);vidas--;mensaje.innerText="⏰ Tiempo";sig();}
},1000);

preguntas[i].respuestas.forEach((r,idx)=>{
let b=document.createElement("button");
b.innerText=r;
b.onclick=()=>{
clearInterval(timer);
if(idx==preguntas[i].correcta){
b.classList.add("correct");puntos+=10;
mensaje.innerText=rand(mensajesOK);
}else{
b.classList.add("incorrect");vidas--;
mensaje.innerText=rand(mensajesNO);
}
sig();
};
respuestas.appendChild(b);
});
}

function sig(){
setTimeout(()=>{
if(vidas<=0){fin("💀 Perdiste");return;}
i++;
if(i<preguntas.length){cargar();}
else{fin("🎉 Ganaste");}
},1200);
}

function actualizar(){
vidasEl.innerText="❤️".repeat(vidas);
puntaje.innerText="⭐ "+puntos;
tiempoEl.innerText="⏱️ "+tiempo;
}

function fin(txt){
pregunta.innerText=txt;
respuestas.innerHTML="";
mensaje.innerText="🌟 Sigue aprendiendo";
}

const menu=document.getElementById("menu");
const quiz=document.getElementById("quiz");
const pregunta=document.getElementById("pregunta");
const respuestas=document.getElementById("respuestas");
const mensaje=document.getElementById("mensaje");
const vidasEl=document.getElementById("vidas");
const tiempoEl=document.getElementById("tiempo");
const puntaje=document.getElementById("puntaje");

</script>

</body>
</html>
